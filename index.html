<header class="topbar glass">

  <button class="iconbtn" id="theme-btn" data-act="theme" aria-label="Toggle theme"></button>

</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar" aria-label="Tabs">
  <button data-act="tab" data-tab="overview"><svg viewBox="0 0 24 24"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Overview</button>
  <button data-act="tab" data-tab="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 9.5h18M6.5 15h4"/></svg>Accounts</button>
  <button data-act="tab" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M6.5 3h7.5l4.5 4.5V21h-12z"/><path d="M14 3v4.5h4.5M9 12h6.5M9 15h6.5M9 18h4"/></svg>Journal</button>
  <button data-act="tab" data-tab="calculator"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7h8M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 14.5h.01M12 14.5h.01M15.5 14.5h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/></svg>Calculator</button>

  <button data-act="tab" data-tab="news"><svg viewBox="0 0 24 24"><path d="M4 5h12v14H6a2 2 0 01-2-2zM16 9h4v8a2 2 0 01-2 2h-2M7 9h6M7 12.5h6M7 16h3"/></svg>News</button>
</nav>
